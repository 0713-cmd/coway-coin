<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코웨이 ESG 보고서 AI 맞춤법 전수 검사기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>tailwind.config={theme:{extend:{colors:{coway:{primary:'#0080C6',dark:'#00223a',light:'#e6f3fa'}}}}}</script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; }
        .hide-scroll::-webkit-scrollbar { width: 6px; }
        .hide-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

    <aside class="w-72 bg-coway-dark text-white flex flex-col z-20 shadow-xl">
        <div class="h-20 flex items-center px-6 border-b border-white/10">
            <div class="bg-coway-primary p-2 rounded-lg mr-3 shadow-lg"><i class="fa-solid fa-layer-group text-xl text-white"></i></div>
            <div><h1 class="text-xl font-bold tracking-wide">ESG Validator</h1><p class="text-[10px] text-blue-200">PNU Engine Ver.</p></div>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2 overflow-y-auto">
            <button onclick="AppUI.switchTab('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center px-4 py-3 bg-coway-primary rounded-xl font-bold shadow-md transition"><i class="fa-solid fa-chart-pie w-6"></i> 통합 검증 대시보드</button>
            <button onclick="AppUI.switchTab('analyzer')" id="nav-analyzer" class="nav-item w-full flex items-center px-4 py-3 text-slate-400 hover:bg-white/5 rounded-xl font-medium transition"><i class="fa-solid fa-magnifying-glass-text w-6"></i> AI 문서 검증기</button>
            <button onclick="AppUI.switchTab('dictionary')" id="nav-dictionary" class="nav-item w-full flex items-center px-4 py-3 text-slate-400 hover:bg-white/5 rounded-xl font-medium transition"><i class="fa-solid fa-book-bookmark w-6"></i> 사내 표준 룰 설정</button>
        </nav>
        <div class="p-5 border-t border-white/10 bg-black/20">
            <button onclick="ExportService.downloadExcel()" class="w-full bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold py-2 rounded-lg transition"><i class="fa-solid fa-file-excel text-green-400 mr-2"></i> 리포트 엑셀 다운로드</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex justify-between items-center px-8 z-10 shadow-sm">
            <h2 id="header-title" class="text-2xl font-bold text-slate-800">통합 검증 대시보드</h2>
            <div class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full font-bold border border-green-200">부산대 맞춤법 API 연동 활성화됨</div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 relative">
            
            <div id="view-dashboard" class="view-pane block fade-in">
                <div class="grid grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-slate-800">
                        <p class="text-slate-500 text-sm font-bold mb-2">스캔 페이지</p>
                        <h3 class="text-3xl font-black text-slate-800" id="stat-pages">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-red-500">
                        <p class="text-slate-500 text-sm font-bold mb-2">PNU 맞춤법 검출</p>
                        <h3 class="text-3xl font-black text-red-500" id="stat-spell">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-orange-500">
                        <p class="text-slate-500 text-sm font-bold mb-2">사내 규정 위반</p>
                        <h3 class="text-3xl font-black text-orange-500" id="stat-dict">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-green-500">
                        <p class="text-slate-500 text-sm font-bold mb-2">그린워싱 의심</p>
                        <h3 class="text-3xl font-black text-green-500" id="stat-green">0</h3>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="font-bold mb-4">유형별 오류 분포</h3><div class="h-64 relative"><canvas id="typeChart"></canvas></div></div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100"><h3 class="font-bold mb-4">페이지별 빈도 (Top 10)</h3><div class="h-64 relative"><canvas id="pageChart"></canvas></div></div>
                </div>
            </div>

            <div id="view-analyzer" class="view-pane hidden">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 flex gap-6">
                    <div class="w-1/3 relative group cursor-pointer bg-coway-light/50 border-2 border-dashed border-coway-primary rounded-xl p-8 text-center">
                        <input type="file" id="pdf-upload" accept="application/pdf" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                        <i class="fa-solid fa-file-arrow-up text-4xl text-coway-primary mb-2 group-hover:-translate-y-1 transition"></i>
                        <h4 class="font-bold">PDF 파일 업로드</h4>
                    </div>
                    <div class="flex-1 bg-slate-50 p-6 rounded-xl border border-slate-200 flex flex-col justify-center">
                        <div class="flex justify-between mb-2"><span class="font-bold" id="status-text">대기 중</span><span class="font-black text-coway-primary" id="progress-percent">0%</span></div>
                        <div class="w-full bg-slate-200 rounded-full h-3"><div id="progress-bar" class="bg-coway-primary h-full w-0 transition-all duration-300"></div></div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 h-[600px] flex flex-col">
                    <div class="px-5 py-3 bg-slate-50 border-b flex justify-between items-center rounded-t-2xl">
                        <h3 class="font-bold"><i class="fa-solid fa-list-check text-coway-primary mr-2"></i>검수 리포트</h3>
                        <span class="text-xs font-bold bg-slate-800 text-white px-3 py-1 rounded-full" id="table-count">발견: 0건</span>
                    </div>
                    <div class="flex-1 overflow-y-auto hide-scroll">
                        <table class="w-full text-sm text-left">
                            <thead class="text-slate-500 bg-white sticky top-0 shadow-sm border-b">
                                <tr>
                                    <th class="px-4 py-3 font-bold w-16">Page</th><th class="px-4 py-3 font-bold w-24">엔진</th>
                                    <th class="px-4 py-3 font-bold w-24">유형</th><th class="px-4 py-3 font-bold">오류 문맥</th>
                                    <th class="px-4 py-3 font-bold text-coway-primary">교정 제안</th>
                                </tr>
                            </thead>
                            <tbody id="result-tbody" class="divide-y divide-slate-100">
                                <tr><td colspan="5" class="px-4 py-16 text-center text-slate-400">PDF를 업로드하면 실시간 검사가 시작됩니다.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="view-dictionary" class="view-pane hidden">
                <div class="bg-white p-8 rounded-2xl shadow-sm border h-[750px] flex flex-col">
                    <h3 class="text-xl font-bold mb-6 pb-4 border-b">사내 규정 및 오타 패턴 사전 (천단위 콤마 제거됨)</h3>
                    <div class="flex-1 overflow-y-auto border rounded-xl hide-scroll">
                        <table class="w-full text-sm text-left">
                            <thead class="bg-slate-50 sticky top-0 border-b">
                                <tr><th class="px-6 py-4 font-bold">탐지 정규식</th><th class="px-6 py-4 font-bold">오류 유형</th><th class="px-6 py-4 font-bold">가이드라인</th></tr>
                            </thead>
                            <tbody id="dict-tbody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // ==========================================
        // 1. Application State & Rules
        // ==========================================
        const State = {
            processing: false,
            stats: { pages: 0, spell: 0, dict: 0, green: 0 },
            results: [],
            // 쓸데없는 콤마 룰 완전 삭제, ESG 실무 룰 구성
            dictionary: [
                { regex: /웅진코웨이/g, type: '명칭 위반', sug: "'코웨이'로 수정" },
                { regex: /전기자/g, type: '자주 틀리는 오타', sug: "'전기차' 확인 요망" },
                { regex: /온신가스/g, type: '자주 틀리는 오타', sug: "'온실가스'로 수정" },
                { regex: /tCO2e(?![q])/g, type: '단위 누락', sug: "표준 단위 'tCO2eq' 통일" },
                { regex: /친환경적인/g, type: '그린워싱 (모호)', sug: "객관적 수치 데이터로 대체" },
                { regex: /세계 최고의/g, type: '그린워싱 (과장)', sug: "최상급 표현 삭제 요망" },
                { regex: /인권 경영/g, type: '띄어쓰기 규정', sug: "사내 규정상 '인권경영'으로 붙여씀" }
            ]
        };

        let chart1, chart2;

        // ==========================================
        // 2. UI Controller
        // ==========================================
        const AppUI = {
            switchTab: (id) => {
                document.querySelectorAll('.view-pane').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('.nav-item').forEach(el => el.className = "nav-item w-full flex items-center px-4 py-3 text-slate-400 hover:bg-white/5 rounded-xl font-medium transition");
                
                document.getElementById(`view-${id}`).classList.remove('hidden');
                const nav = document.getElementById(`nav-${id}`);
                nav.className = "nav-item w-full flex items-center px-4 py-3 bg-coway-primary text-white rounded-xl font-bold shadow-md transition";
                document.getElementById('header-title').innerText = nav.innerText.trim();
            },
            updateProgress: (pct, txt) => {
                document.getElementById('progress-bar').style.width = `${pct}%`;
                document.getElementById('progress-percent').innerText = `${pct}%`;
                document.getElementById('status-text').innerText = txt;
            },
            appendResult: (data) => {
                const tbody = document.getElementById('result-tbody');
                if (State.results.length === 1) tbody.innerHTML = '';

                const srcBadge = data.src === 'PNU' 
                    ? `<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-1 rounded text-xs font-bold">부산대 API</span>`
                    : `<span class="bg-orange-50 text-orange-700 border border-orange-200 px-2 py-1 rounded text-xs font-bold">사내 룰</span>`;
                
                let tCol = 'text-slate-600';
                if(data.type.includes('맞춤법')) tCol = 'text-red-600';
                if(data.type.includes('그린워싱')) tCol = 'text-green-600';

                const safeOrig = data.orig.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const highlighted = data.ctx.replace(new RegExp(safeOrig, 'g'), `<span class="bg-yellow-200 text-red-600 font-bold px-1 rounded">${data.orig}</span>`);

                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="px-4 py-3 font-black">${data.page}p</td><td class="px-4 py-3">${srcBadge}</td>
                    <td class="px-4 py-3 font-bold ${tCol}">${data.type}</td>
                    <td class="px-4 py-3 text-slate-600 italic leading-relaxed">"${highlighted}"</td>
                    <td class="px-4 py-3 font-bold text-coway-primary">${data.sug}</td>
                `;
                tbody.prepend(tr);
                document.getElementById('table-count').innerText = `발견: ${State.results.length}건`;
            },
            syncDash: () => {
                document.getElementById('stat-pages').innerText = State.stats.pages;
                document.getElementById('stat-spell').innerText = State.stats.spell;
                document.getElementById('stat-dict').innerText = State.stats.dict;
                document.getElementById('stat-green').innerText = State.stats.green;
                
                if(chart1) chart1.destroy();
                chart1 = new Chart(document.getElementById('typeChart'), {
                    type: 'doughnut',
                    data: { labels: ['PNU 교정', '사전 룰', '그린워싱'], datasets: [{ data: [State.stats.spell, State.stats.dict, State.stats.green], backgroundColor: ['#ef4444','#f97316','#22c55e'], cutout: '70%' }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                const pMap = {}; State.results.forEach(r => pMap[r.page] = (pMap[r.page]||0)+1);
                const sorted = Object.entries(pMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
                if(chart2) chart2.destroy();
                chart2 = new Chart(document.getElementById('pageChart'), {
                    type: 'bar',
                    data: { labels: sorted.map(v=>`${v[0]}p`), datasets: [{ label: '오류 수', data: sorted.map(v=>v[1]), backgroundColor: '#0080C6' }] },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            }
        };

        // ==========================================
        // 3. Analysis Engines
        // ==========================================
        const Engine = {
            runLocal: (text, page) => {
                State.dictionary.forEach(rule => {
                    const regex = new RegExp(rule.regex);
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        const orig = match[0], idx = match.index;
                        const ctx = `...${text.substring(Math.max(0, idx-15), Math.min(text.length, idx+orig.length+15))}...`;
                        const res = { page, src: 'LOCAL', type: rule.type, orig, ctx, sug: rule.sug };
                        State.results.push(res); AppUI.appendResult(res);
                        rule.type.includes('그린워싱') ? State.stats.green++ : State.stats.dict++;
                    }
                });
            },
            runPNU: async (text, page) => {
                if(text.trim().length < 5) return;
                try {
                    // [핵심 연동] Vercel 서버리스(/api/proxy)로 텍스트를 던짐
                    const response = await fetch('/api/proxy', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text })
                    });
                    const data = await response.json();
                    
                    if (data.success && data.data.length > 0) {
                        data.data.forEach(pageError => {
                            pageError.errInfo.forEach(err => {
                                // err.orgStr(원본), err.candWord(수정제안), err.help(이유)
                                const idx = text.indexOf(err.orgStr);
                                const ctx = idx > -1 ? `...${text.substring(Math.max(0, idx-15), Math.min(text.length, idx+err.orgStr.length+15))}...` : err.orgStr;
                                const res = { page, src: 'PNU', type: '맞춤법/띄어쓰기', orig: err.orgStr, ctx, sug: err.candWord };
                                State.results.push(res); AppUI.appendResult(res);
                                State.stats.spell++;
                            });
                        });
                    }
                } catch (e) {
                    console.error('PNU 통신 에러:', e);
                }
            }
        };

        // ==========================================
        // 4. Events & Initialization
        // ==========================================
        document.getElementById('pdf-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file || State.processing) return;

            State.processing = true; State.results = []; State.stats = { pages:0, spell:0, dict:0, green:0 };
            document.getElementById('result-tbody').innerHTML = '';
            
            try {
                const buffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(buffer).promise;
                State.stats.pages = pdf.numPages;

                for (let i = 1; i <= pdf.numPages; i++) {
                    AppUI.updateProgress(Math.round((i/pdf.numPages)*100), `[${i}p] PNU 맞춤법 검사 중...`);
                    const page = await pdf.getPage(i);
                    const text = (await page.getTextContent()).items.map(t => t.str).join(' ');

                    Engine.runLocal(text, i);
                    
                    // 500자씩 청킹하여 부산대 엔진에 과부하 방지 (중요!)
                    const chunks = text.match(/.{1,500}/g) || [];
                    for (const chunk of chunks) await Engine.runPNU(chunk, i);
                }

                AppUI.updateProgress(100, "전수 검증 완료");
                AppUI.syncDash();
                Swal.fire('완료', 'PNU 맞춤법 교정이 완료되었습니다.', 'success');
            } catch (err) {
                Swal.fire('오류', 'PDF 파싱 실패', 'error');
            } finally {
                State.processing = false;
            }
        });

        const ExportService = {
            downloadExcel: () => {
                if (State.results.length === 0) return Swal.fire('알림', '데이터 없음', 'warning');
                const ws = XLSX.utils.json_to_sheet(State.results.map(r => ({'페이지':r.page+'p','엔진':r.src,'유형':r.type,'원본':r.orig,'문맥':r.ctx,'제안':r.sug})));
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "결과");
                XLSX.writeFile(wb, `코웨이_ESG_검증결과.xlsx`);
            }
        };

        // 사전 렌더링
        const t = document.getElementById('dict-tbody');
        State.dictionary.forEach(d => t.innerHTML+=`<tr><td class="px-6 py-4 font-mono font-bold text-coway-primary">/${d.regex.source}/g</td><td class="px-6 py-4 font-bold">${d.type}</td><td class="px-6 py-4">${d.sug}</td></tr>`);
        AppUI.syncDash();
    </script>
</body>
</html>
